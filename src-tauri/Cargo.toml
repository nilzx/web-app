[package]
name = "webdock"
version = "0.1.0"
description = "A cross-platform desktop shell for local web apps"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[lib]
name = "webdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "image-ico", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
anyhow = "1"
log = "0.4"
mime_guess = "2"
notify = "8"
notify-debouncer-mini = "0.7"
tiny_http = "0.12"
percent-encoding = "2"
dirs = "6"
sys-locale = "0.3"
