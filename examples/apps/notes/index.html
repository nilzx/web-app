<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Local notes in IndexedDB; demonstrates Vite-style absolute paths and history routing">
  <meta name="theme-color" content="#f59e0b">
  <meta name="color-scheme" content="light dark">
  <title>Notes</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg">
  <!-- Absolute paths, exactly like a default Vite build output -->
  <link rel="stylesheet" crossorigin href="/assets/style.css">
  <script type="module" crossorigin src="/assets/app.js"></script>
</head>
<body>
  <aside>
    <div class="head">
      <input id="q" type="search" placeholder="Search…">
      <button id="new" title="New note (Ctrl+N)">+</button>
    </div>
    <ul id="list"></ul>
  </aside>
  <main>
    <input id="title" placeholder="Title" autocomplete="off">
    <textarea id="body" placeholder="Start writing…"></textarea>
    <footer><span id="saved"></span><button id="del">Delete</button></footer>
  </main>
</body>
</html>
